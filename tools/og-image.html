<!doctype html>
<!-- Source for public/og-image.png (1200x630 link preview). Regenerate with:
     msedge --headless --screenshot=public/og-image.png --window-size=1200,630 tools/og-image.html -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@700&display=block" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{font-family:Inter,sans-serif;background:#0A0E14;background-image:radial-gradient(rgba(148,163,184,.12) 1px,transparent 1px);background-size:24px 24px;color:#E6EDF3;position:relative}
  .glow{position:absolute;border-radius:50%;filter:blur(110px)}
  .g1{width:520px;height:520px;background:#4ADE80;opacity:.18;left:-160px;top:-160px}
  .g2{width:520px;height:520px;background:#22D3EE;opacity:.16;right:-160px;bottom:-200px}
  .wrap{position:absolute;left:88px;top:110px}
  .pill{display:inline-flex;align-items:center;gap:10px;font-family:'JetBrains Mono',monospace;font-size:20px;color:#4ADE80;border:1px solid rgba(74,222,128,.4);background:rgba(74,222,128,.1);padding:8px 18px;border-radius:999px}
  .dot{width:10px;height:10px;border-radius:50%;background:#4ADE80}
  h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:120px;letter-spacing:-3px;line-height:1;margin:34px 0 0}
  h1 span{background:linear-gradient(95deg,#4ADE80,#22D3EE);-webkit-background-clip:text;background-clip:text;color:transparent}
  .role{font-family:'JetBrains Mono',monospace;font-size:36px;margin-top:26px;color:#E6EDF3}
  .role b{color:#4ADE80;font-weight:600}
  .caret{display:inline-block;width:18px;height:34px;background:#4ADE80;vertical-align:-5px;margin-left:6px}
  .tags{font-family:'JetBrains Mono',monospace;font-size:22px;color:#94A3B8;margin-top:40px}
  .tags i{color:#4ADE80;font-style:normal}
  .url{position:absolute;right:88px;bottom:64px;font-family:'JetBrains Mono',monospace;font-size:20px;color:#94A3B8}
</style></head>
<body>
  <div class="glow g1"></div><div class="glow g2"></div>
  <div class="wrap">
    <div class="pill"><span class="dot"></span>open to new roles · Toronto, ON</div>
    <h1>Farhan <span>Patel</span></h1>
    <div class="role"><b>&gt;_</b> Software Engineer<span class="caret"></span></div>
    <div class="tags"><i>//</i> Python · FastAPI · PostGIS · PyTorch · Docker</div>
  </div>
  <div class="url">farhanpatel-dev.github.io/portfolio</div>
</body></html>
