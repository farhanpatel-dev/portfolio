<!doctype html>
<!-- Source for public/og-image.png (1200x630 link preview). Regenerate with:
     msedge --headless --screenshot=public/og-image.png --window-size=1200,630 tools/og-image.html -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600&family=Playfair+Display:ital@0;1&display=block" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{font-family:'DM Sans',sans-serif;background:radial-gradient(ellipse at 25% 20%,#FAF6EF 0%,#F3EBDD 45%,#E8D9C0 100%);position:relative;color:#2E2119}
  .blob{position:absolute;border-radius:50%;filter:blur(90px)}
  .b1{width:520px;height:520px;background:#D4BC96;opacity:.55;left:-120px;top:-80px}
  .b2{width:460px;height:460px;background:#C9A227;opacity:.3;right:-60px;bottom:-140px}
  .frame{position:absolute;inset:36px;border:1px solid rgba(176,138,91,.45);border-radius:28px}
  .wrap{position:absolute;left:96px;top:118px;right:96px}
  .eyebrow{font-size:20px;letter-spacing:.38em;text-transform:uppercase;color:#7A5C3E;font-weight:600}
  h1{font-family:'Playfair Display',serif;font-weight:400;font-size:132px;line-height:1;margin:26px 0 0}
  h1 em{background:linear-gradient(100deg,#7A5C3E,#B08A5B 55%,#C9A227);-webkit-background-clip:text;background-clip:text;color:transparent}
  .role{font-family:'Playfair Display',serif;font-style:italic;font-size:44px;color:#7A5C3E;margin-top:22px}
  .line{width:120px;height:2px;background:linear-gradient(90deg,#B08A5B,#C9A227);margin:34px 0 26px}
  .tags{font-size:24px;color:rgba(46,33,25,.75)}
  .mono{position:absolute;right:96px;top:96px;width:150px;height:190px;border-radius:999px 999px 24px 24px;padding:3px;background:conic-gradient(from 140deg,#C9A227,#F3EBDD,#B08A5B,#C9A227)}
  .mono div{width:100%;height:100%;border-radius:999px 999px 22px 22px;background:#FAF6EF;display:grid;place-items:center;font-family:'Playfair Display',serif;font-style:italic;font-size:64px;color:#B08A5B}
</style></head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div><div class="frame"></div>
  <div class="mono"><div>FP</div></div>
  <div class="wrap">
    <div class="eyebrow">Portfolio · Toronto, ON</div>
    <h1>Farhan <em>Patel</em></h1>
    <div class="role">Software Engineer</div>
    <div class="line"></div>
    <div class="tags">Python · FastAPI · PostGIS · PyTorch · Docker</div>
  </div>
</body></html>
