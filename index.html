<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Farhan Patel · Software Engineer</title>
    <meta name="description" content="Farhan Patel is a software engineer in Toronto building reliable Python services, geospatial APIs and production machine learning. M.Sc. Computer Science, Western University." />
    <meta name="author" content="Farhan Patel" />
    <link rel="canonical" href="https://farhanpatel-dev.github.io/portfolio/" />
    <meta name="theme-color" content="#0A0E14" />

    <!-- Open Graph (LinkedIn, WhatsApp, Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Farhan Patel" />
    <meta property="og:title" content="Farhan Patel · Software Engineer" />
    <meta property="og:description" content="Reliable Python services and machine learning models, built for production." />
    <meta property="og:url" content="https://farhanpatel-dev.github.io/portfolio/" />
    <meta property="og:image" content="https://farhanpatel-dev.github.io/portfolio/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Farhan Patel, Software Engineer" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Farhan Patel · Software Engineer" />
    <meta name="twitter:description" content="Reliable Python services and machine learning models, built for production." />
    <meta name="twitter:image" content="https://farhanpatel-dev.github.io/portfolio/og-image.png" />

    <!-- Icons (paths are prefixed with the /portfolio/ base at build time) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Fonts (Playfair Display + DM Sans) are self-hosted via @fontsource in src/main.jsx -->

    <!-- Structured data for search engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Farhan Patel",
        "jobTitle": "Software Engineer",
        "url": "https://farhanpatel-dev.github.io/portfolio/",
        "address": { "@type": "PostalAddress", "addressLocality": "Toronto", "addressRegion": "ON", "addressCountry": "CA" },
        "alumniOf": [{ "@type": "CollegeOrUniversity", "name": "Western University" }, { "@type": "CollegeOrUniversity", "name": "Sanjay Ghodawat University" }],
        "sameAs": ["https://www.linkedin.com/in/patel-farhan", "https://github.com/farhanpatel-dev"]
      }
    </script>

    <!-- Dark by default; apply a saved "light" choice before first paint (no flash). -->
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('fp-theme'); } catch (e) {}
        if (t !== 'light') document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <noscript>
      <p style="padding:2rem;font-family:sans-serif">Farhan Patel, Software Engineer. Email: farhanpatel1802@gmail.com · LinkedIn: linkedin.com/in/patel-farhan · GitHub: github.com/farhanpatel-dev</p>
    </noscript>
    <!-- Filled with prerendered HTML at build time by scripts/prerender.mjs -->
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
